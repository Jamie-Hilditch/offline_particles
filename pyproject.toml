[project]
authors = [
  {name = "Jamie", email = "hilditch@stanford.edu"},
]
dependencies = [
  "dask>=2025.11.0",
  "numba>=0.63.1",
  "numpy>=2.3.5",
  "xarray>=2026.2.0",
  "zarr>=3.1.5",
]
description = "Add your description here"
name = "offline-particles"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"

[build-system]
requires = ["scikit-build-core", "cython", "cython-cmake"]
build-backend = "scikit_build_core.build"

[dependency-groups]
dev = [
  "cython-lint>=0.18.1",
  "furo>=2025.12.19",
  "myst-parser>=5.0.0",
  "pre-commit>=4.5.1",
  "pydata-sphinx-theme>=0.17.0",
  "pytest>=9.0.2",
  "ruff==0.15.13",
  "sphinx>=9.1.0",
  "sphinx-autoapi>=3.8.0",
  "ty>=0.0.8",
]

[tool.ruff]
preview = true # needed for DOC rules
line-length = 120

[tool.ruff.lint]
pydocstyle.convention = "numpy"
extend-select = ["D", "DOC", "I"]
ignore = [
  "D1", # Missing public docstrings
  "E266"
]

[tool.ruff.format]
docstring-code-format = true

[tool.cython-lint]
paths = ["src"]
max-line-length = 120
ignore = ["E266"]

[tool.pytest.ini_options]
testpaths = [
  "tests",
  "src",
]
addopts = [
  "--doctest-modules",
]
