[project]
authors = [
  {name = "Jamie", email = "hilditch@stanford.edu"},
]
dependencies = [
  "dask>=2025.11.0",
  "numba>=0.63.1",
  "numpy>=2.3.5",
  "xarray>=2026.2.0",
  "zarr>=3.1.5",
]
description = "Add your description here"
name = "offline-particles"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "hypothesis>=6.140.4",
  "myst-parser>=5.0.0",
  "pre-commit>=4.5.1",
  "pytest>=9.0.2",
  "ruff==0.15.13",
  "sphinx==9.1.0",
  "sphinx-autoapi>=3.8.0",
  "sphinx-book-theme>=1.1.4",
  "ty>=0.0.8",
]

[tool.ruff]
preview = true # needed for DOC rules
line-length = 120

[tool.ruff.lint]
pydocstyle.convention = "numpy"
extend-select = ["D", "DOC", "I"]
ignore = [
  "D1", # Missing public docstrings
  "DOC502", # docstring-extraneous-exception (we want to document all exceptions, even if they are raised via another function)
  "E266"
]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = [
  "tests",
  "src",
]
addopts = [
  "--doctest-modules",
]
