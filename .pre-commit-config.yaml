repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.14.10
  hooks:
    # Run the linter.
    - id: ruff-check
      files: ^(src|tests)/
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
      files: ^(src|tests)/
- repo: https://github.com/MarcoGorelli/cython-lint
  rev: v0.18.1
  hooks:
    - id: cython-lint
      files: ^src/.*\.pyx?$
- repo: local
  hooks:
    - id: ty
      name: ty type check
      language: system
      entry: ty check
      pass_filenames: false
      types: [python]
      files: ^(src|tests)/.*\.py$