repos:
- repo: local
  hooks:
    # Run the ruff linter.
    - id: ruff-check
      name: ruff check
      language: system
      entry: uv run --frozen ruff check
      types_or: [python, pyi]
      args: [--fix]
      files: ^(src|tests|docs/source)/
    # Run the ruff formatter.
    - id: ruff-format
      name: ruff format
      language: system
      entry: uv run --frozen ruff format
      types_or: [python, pyi]
      files: ^(src|tests|docs/source)/
    # Enforce one-line @property docstrings.
    - id: property-docstrings
      name: property docstrings
      language: system
      entry: uv run --frozen pytest tests/docstring_conventions/test_property_docstrings.py -q
      pass_filenames: false
      files: ^src/
