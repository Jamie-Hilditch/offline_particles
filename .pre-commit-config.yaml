repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.14.10
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
- repo: https://github.com/MarcoGorelli/cython-lint
  rev: v0.18.1
  hooks:
    - id: cython-lint
- repo: local
  hooks:
    - id: ty
      name: ty type check
      language: python
      entry: ty check
      pass_filenames: false
      types: [python]
      additional_dependencies: ["ty>=0.0.8"]