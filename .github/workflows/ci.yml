name: CI
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ty:
    name: ty type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: uv sync --frozen --group dev
      - name: Run ty check
        run: uv run ty check

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: uv sync --frozen --group dev
      - name: Run ruff check
        run: uv run ruff check --output-format=github --fix --exit-non-zero-on-fix --diff .
      - name: Run ruff format
        run: uv run ruff format --check .

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install project with dev dependencies
        run: uv sync --frozen --group dev
      - name: Run pytest
        run: uv run pytest
